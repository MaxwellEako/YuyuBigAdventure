<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fafaf8" />
    <meta
      name="description"
      content="屿屿大冒险 · 心阵棋局：在棋盘上冒险，用不同形状的武器打碎怪物的红心矩阵。"
    />
    <link rel="icon" type="image/svg+xml" href="/heart.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 网页字体等页面加载完再请求：连不上 Google Fonts 时直接用系统字体，不会拖住页面。 -->
    <script>
      addEventListener(
        "load",
        () => {
          const link = document.createElement("link");
          link.rel = "stylesheet";
          link.href = "https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@200;300;400;500;700&display=swap";
          document.head.appendChild(link);
        },
        { once: true },
      );
    </script>
    <title>心阵棋局 · 屿屿大冒险</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/battle/main.js"></script>
  </body>
</html>
